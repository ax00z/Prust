[package]
name = "prust"
version = "0.1.0"
edition = "2024"
description = "PE static analyzer — parses PE files and outputs a triage report"

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive"] }
# JSON output
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# File and import hashing (SHA256, MD5 for imphash/legacy lookup)
sha2 = "0.10"
md-5 = "0.10"
