[package]
name = "sigkill"
version = "0.1.0"
edition = "2024"
description = "Authenticode + BYOVD auditor"

[[bin]]
name = "prust"
path = "src/main.rs"

[lib]
name = "sigkill"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3", "dep:pythonize"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10"
cms = "0.2"
x509-cert = "0.2"
der = "0.7"
dirs = "5"
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"], optional = true }
pythonize = { version = "0.23", optional = true }
